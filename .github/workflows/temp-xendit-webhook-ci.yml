name: temp-xendit-webhook-ci

on:
  push:
    branches:
      - fix/xendit-dashboard-webhook-ack

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NeverfadePos.slnx
      - name: Test
        run: dotnet test NeverfadePos.slnx --no-restore --configuration Release
